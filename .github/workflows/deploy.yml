name: Deploy

# Déploie après un CI vert sur main : migrations Neon → API Render → site Netlify.
# Secrets requis (Settings → Secrets and variables → Actions) :
#   NEON_DATABASE_URL_DIRECT  URL Neon *directe* (sans -pooler) pour prisma migrate
#   RENDER_DEPLOY_HOOK_URL    Render → service captivia-api → Settings → Deploy Hook
#   NETLIFY_AUTH_TOKEN        Netlify → User settings → Applications → Personal access token
#   NETLIFY_SITE_ID           Netlify → captivia → Site configuration → Site ID
# Variables (onglet Variables) :
#   API_URL                   ex. https://captivia-api.onrender.com
#   WEB_URL                   ex. https://captivia.netlify.app

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      seed:
        description: "Exécuter le seed de production (idempotent) après les migrations"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: backend
        run: npm ci
      - name: Prisma migrate deploy
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_DIRECT }}
        run: npx prisma migrate deploy
      - name: Seed production (optionnel)
        if: github.event_name == 'workflow_dispatch' && inputs.seed
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_DIRECT }}
        run: npx prisma db seed

  deploy-api:
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Déclencher le déploiement Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST "$HOOK" > /dev/null
      - name: Attendre que l'API réponde
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          # Laisse Render démarrer la nouvelle version (build Docker ~3-6 min).
          sleep 90
          for i in $(seq 1 60); do
            if curl -fsS --max-time 20 "$API_URL/health" > /dev/null; then
              echo "API OK"; exit 0
            fi
            sleep 10
          done
          echo "::error::L'API ne répond pas sur $API_URL/health"; exit 1

  deploy-web:
    needs: deploy-api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build et déploiement Netlify (production)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL }}
        run: npx --yes netlify-cli@latest deploy --build --prod --filter frontend --message "deploy ${GITHUB_SHA::7}"
      - name: Smoke test
        env:
          WEB_URL: ${{ vars.WEB_URL }}
        run: curl -fsS --max-time 30 "$WEB_URL/fr" > /dev/null
