name: Seed production

# Ce workflow ne déploie plus rien. Depuis l'intégration Git (DEP-01) :
#   - Render reconstruit l'API tout seul après un push sur main (autoDeployTrigger: checksPass
#     dans render.yaml : il attend que le CI soit vert, migrations Neon comprises) ;
#   - Netlify reconstruit le site tout seul (et publie des previews de PR) ;
#   - les migrations Prisma sont appliquées par le job « migrate-production » de ci.yml.
# Les anciens jobs « deploy hook Render » et « netlify-cli » sont donc supprimés.
#
# Reste ici le seul geste manuel : charger le catalogue (espèces, races, magasins…) dans
# la base de production. Le seed est idempotent (upsert) et peut être relancé.
#
# Lancement : Actions → « Seed production » → Run workflow.
# Secret requis : NEON_DATABASE_URL_DIRECT (URL Neon DIRECTE, sans « -pooler »).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seed-production
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_DIRECT }}
    steps:
      - name: Garde — secret NEON_DATABASE_URL_DIRECT
        id: guard
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::Secret NEON_DATABASE_URL_DIRECT absent : seed de production ignoré (voir docs/DEPLOY.md)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Normalisation tolérante d'un copier-coller depuis la console Neon (sans jamais
          # afficher la valeur) : espaces/retours à la ligne, préfixe « psql », guillemets.
          url="$(printf '%s' "$DATABASE_URL" | tr -d '\r\n' | sed -E "s/^[[:space:]]+|[[:space:]]+$//g; s/^psql[[:space:]]+//; s/^['\"]+|['\"]+$//g")"
          echo "::add-mask::$url"
          case "$url" in
            postgresql://*|postgres://*) ;;
            *)
              echo "::error title=NEON_DATABASE_URL_DIRECT invalide::La valeur du secret doit commencer par postgresql:// (longueur ${#url} caractères, contient 'postgresql://' : $(case "$url" in *postgresql://*) echo oui;; *) echo non;; esac)). Dans Neon → Connect, copiez la chaîne de connexion seule (pas la commande psql), sans guillemets."
              exit 1;;
          esac
          case "$url" in
            *-pooler.*) echo "::warning title=URL poolée::NEON_DATABASE_URL_DIRECT pointe vers l'hôte « -pooler » : utilisez l'URL DIRECTE (Connection pooling désactivé) pour les migrations.";;
          esac
          echo "NEON_URL=$url" >> "$GITHUB_ENV"
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.guard.outputs.skip != 'true'
      - uses: actions/setup-node@v7
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        if: steps.guard.outputs.skip != 'true'
        working-directory: backend
        run: npm ci
      - name: Prisma migrate deploy
        if: steps.guard.outputs.skip != 'true'
        working-directory: backend
        run: DATABASE_URL="$NEON_URL" npx prisma migrate deploy
      - name: Seed production (idempotent)
        if: steps.guard.outputs.skip != 'true'
        working-directory: backend
        run: DATABASE_URL="$NEON_URL" npx prisma db seed
