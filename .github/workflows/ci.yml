name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Déclenchement manuel : indispensable pour atteindre le job « e2e » (réservé à workflow_dispatch).
  workflow_dispatch:

# Principe du moindre privilège : aucun job n'a besoin d'écrire dans le dépôt.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Jamais d'annulation sur main : un push suivant ne doit pas interrompre une
  # migration de production en cours (voir le job migrate-production).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: captivia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d captivia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/captivia?schema=public
      JWT_SECRET: ci-test-secret-at-least-16-chars-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: backend
        run: npm ci
      # Build (prisma generate + nest build) avant tsc : le client Prisma doit exister.
      - name: Build
        working-directory: backend
        run: npm run build
      - name: Typecheck
        working-directory: backend
        run: npx tsc --noEmit
      - name: Migrate
        working-directory: backend
        run: npx prisma migrate deploy && npx prisma db seed
      - name: Tests (unitaires + e2e)
        working-directory: backend
        run: npm test -- --runInBand

  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      # Les tests passent avant le build : après `next build`, .next/ contient des
      # package.json qui provoquaient des collisions Haste (voir jest.config.ts).
      - name: Tests
        working-directory: frontend
        run: npm test -- --ci
      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
        run: npm run build

  # Images Docker de production : on vérifie seulement qu'elles se construisent (pas de push).
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image backend (target runtime)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          target: runtime
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build image frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.example.com
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  # Lint frontend : BLOQUANT.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: ESLint frontend (lecture seule, bloquant)
        working-directory: frontend
        # NB : pas de `--format compact` (formateur retiré du cœur d'ESLint 9, il faisait
        # échouer la commande, ce que l'ancien `|| true` masquait).
        run: npx eslint "src/**/*.{ts,tsx}" --no-fix

  # Lint backend : NON BLOQUANT (continue-on-error) tant que la dette historique n'est
  # pas résorbée (~2 083 erreurs ESLint, surtout des no-unsafe-*). À rendre bloquant
  # (retirer continue-on-error) à la fin de la tâche W1-07 « Dette lint et code mort ».
  lint-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: backend
        run: npm ci
      - name: ESLint backend (informatif, W1-07)
        working-directory: backend
        run: npx eslint "src/**/*.ts" --no-fix

  # Atteignable uniquement via « Run workflow » (workflow_dispatch).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: captivia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d captivia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/captivia?schema=public
      JWT_SECRET: ci-test-secret-at-least-16-chars-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: npm ci
      - name: Migrate + seed
        working-directory: backend
        run: npx prisma migrate deploy && npx prisma db seed && npm run seed:dev
      - name: E2E
        working-directory: backend
        run: npm run test:e2e -- --runInBand
