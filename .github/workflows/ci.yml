name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: captivia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d captivia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/captivia?schema=public
      JWT_SECRET: ci-test-secret-at-least-16-chars-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: backend
        run: npm ci
      - name: Migrate
        working-directory: backend
        run: npx prisma migrate deploy && npx prisma db seed
      - name: Unit tests
        working-directory: backend
        run: npm test -- --runInBand

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build

  quality:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ESLint (read-only, no fix)
        working-directory: backend
        run: npx eslint "src/**/*.ts" --no-fix --format compact || true
      - name: ESLint frontend (read-only, no fix)
        working-directory: frontend
        run: npx eslint "src/**/*.{ts,tsx}" --no-fix --format compact || true

  e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: captivia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d captivia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/captivia?schema=public
      JWT_SECRET: ci-test-secret-at-least-16-chars-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend
        working-directory: backend
        run: npm ci
      - name: Migrate + seed
        working-directory: backend
        run: npx prisma migrate deploy && npx prisma db seed && npm run seed:dev
      - name: E2E
        working-directory: backend
        run: npx jest test --runInBand
