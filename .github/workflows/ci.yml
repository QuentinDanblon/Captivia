name: CI

# Économie de minutes Actions (dépôt privé, quota gratuit) : les changements purement
# documentaires ne relancent pas la CI.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'backend/prisma/enrichment/in/**']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'backend/prisma/enrichment/in/**']
  # Déclenchement manuel : relance toute la CI à la demande.
  workflow_dispatch:

# Principe du moindre privilège : aucun job n'a besoin d'écrire dans le dépôt.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Jamais d'annulation sur main : un push suivant ne doit pas interrompre une
  # migration de production en cours (voir le job migrate-production).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: captivia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d captivia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/captivia?schema=public
      JWT_SECRET: ci-test-secret-at-least-16-chars-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: backend
        run: npm ci
      # Build (prisma generate + nest build) avant tsc : le client Prisma doit exister.
      - name: Build
        working-directory: backend
        run: npm run build
      - name: Typecheck
        working-directory: backend
        run: npx tsc --noEmit
      - name: Migrate
        working-directory: backend
        run: npx prisma migrate deploy && npx prisma db seed
      # Les e2e backend (test/*.e2e-spec.ts, Postgres ci-dessus) tournent DANS ce job, sur
      # pull_request et push : la config Jest (roots src + test) les inclut dans `npm test`.
      # Garde : échec si elle venait à les exclure (ils ne tourneraient alors plus nulle part).
      - name: Garde — e2e backend inclus dans npm test
        working-directory: backend
        run: |
          listed="$(npx jest --listTests)"
          for spec in auth-session-race auth-refresh-tokens push-ssrf agenda account email-verification; do
            if ! grep -q "test/${spec}.e2e-spec.ts$" <<<"$listed"; then
              echo "::error::test/${spec}.e2e-spec.ts n'est pas exécuté par npm test"
              exit 1
            fi
          done
          echo "$(grep -c 'e2e-spec.ts$' <<<"$listed") suites e2e incluses."
      - name: Tests (unitaires + e2e)
        working-directory: backend
        run: npm test -- --runInBand

  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      # Les tests passent avant le build : après `next build`, .next/ contient des
      # package.json qui provoquaient des collisions Haste (voir jest.config.ts).
      - name: Tests
        working-directory: frontend
        run: npm test -- --ci
      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
        run: npm run build

  # Images Docker de production : on vérifie seulement qu'elles se construisent (pas de push).
  # Image Docker (≈ 7 min) : construite sur main et en manuel seulement ; Render la
  # reconstruit de toute façon au déploiement. Sur les PR, le build TypeScript du backend
  # (test-backend) et du frontend (build-frontend) couvrent l'essentiel.
  docker-build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image backend (target runtime)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          target: runtime
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build image frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.example.com
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  # Lint frontend : BLOQUANT.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: ESLint frontend (lecture seule, bloquant)
        working-directory: frontend
        # NB : pas de `--format compact` (formateur retiré du cœur d'ESLint 9, il faisait
        # échouer la commande, ce que l'ancien `|| true` masquait).
        run: npx eslint "src/**/*.{ts,tsx}" "e2e/**/*.ts" "mobile/**/*.tsx" --no-fix
      # Garde-fou du système visuel (frontend/docs/DESIGN.md § 9) : aucun reste de l'ancien
      # style (variante sombre, couleurs Tailwind brutes, dégradés, grands rayons, ombres
      # floues, verre dépoli, capitales espacées, anciennes variables) hors tests.
      - name: Garde — motifs de style interdits
        working-directory: frontend
        run: |
          pattern='dark:|\b(bg|text|border|ring|outline|fill|stroke|from|via|to|divide|decoration|placeholder|shadow)-(slate|gray|zinc|neutral|stone|red|orange|amber|yellow|lime|green|emerald|teal|cyan|sky|blue|indigo|violet|purple|fuchsia|pink|rose)-[0-9]{2,3}\b|\b(bg|text|border)-(white|black)\b|bg-gradient-|\brounded-(lg|xl|2xl|3xl)\b|\bshadow-(sm|md|lg|xl|2xl)\b|backdrop-blur|\buppercase\b|tracking-(wider|widest)|var\(--captivia-'
          if grep -rnE --include='*.ts' --include='*.tsx' --include='*.css' --exclude-dir=__tests__ --exclude='*.test.*' "$pattern" src mobile; then
            echo "::error title=Style interdit::Motifs hors système visuel trouvés ci-dessus (voir frontend/docs/DESIGN.md § 9)."
            exit 1
          fi
          echo "Aucun motif interdit."

  # Lint backend : NON BLOQUANT (continue-on-error) tant que la dette historique n'est
  # pas résorbée (~2 083 erreurs ESLint, surtout des no-unsafe-*). À rendre bloquant
  # (retirer continue-on-error) à la fin de la tâche W1-07 « Dette lint et code mort ».
  lint-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: backend
        run: npm ci
      # Informatif tant que la dette historique (W1-07) n'est pas résorbée : le
      # continue-on-error est posé sur l'étape et non sur le job, pour que le check reste
      # vert. Render (autoDeployTrigger: checksPass) attend que TOUS les checks soient
      # verts. Le nombre d'erreurs est publié dans le résumé du job.
      - name: ESLint backend (informatif, W1-07)
        id: eslint
        working-directory: backend
        continue-on-error: true
        run: npx eslint "src/**/*.ts" --no-fix
      - name: Résumé lint
        if: steps.eslint.outcome == 'failure'
        run: echo "::warning title=Lint backend::ESLint backend signale des erreurs (dette W1-07, non bloquant) — voir l'étape ESLint."

  # Applique les migrations Prisma sur Neon AVANT le déploiement de Render.
  # Render est configuré en `autoDeployTrigger: checksPass` : il attend que tous les
  # checks GitHub du commit soient verts, dont celui-ci, puis déploie. Les migrations
  # doivent donc rester « expand/contract » (compatibles avec la version N-1 de l'API).
  # Prérequis : secret NEON_DATABASE_URL_DIRECT (URL Neon DIRECTE, sans « -pooler »).
  # Sans ce secret, le job est ignoré proprement (avertissement, pas d'échec).
  migrate-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Migrer seulement si TOUT ce qui conditionne le déploiement Render est vert,
    # sinon la base serait migrée sans que la nouvelle API soit déployée.
    needs: [test-backend, build-frontend, docker-build, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    # Groupe dédié, sans annulation : une migration ne doit jamais être interrompue
    # ni exécutée deux fois en parallèle.
    concurrency:
      group: migrate-production
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_DIRECT }}
    steps:
      - name: Garde — secret NEON_DATABASE_URL_DIRECT
        id: guard
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::Secret NEON_DATABASE_URL_DIRECT absent : migrations de production ignorées (voir docs/DEPLOY.md)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Normalisation tolérante d'un copier-coller depuis la console Neon (sans jamais
          # afficher la valeur) : espaces/retours à la ligne, préfixe « psql », guillemets.
          url="$(printf '%s' "$DATABASE_URL" | tr -d '\r\n' | sed -E "s/^[[:space:]]+|[[:space:]]+$//g; s/^psql[[:space:]]+//; s/^['\"]+|['\"]+$//g")"
          echo "::add-mask::$url"
          case "$url" in
            postgresql://*|postgres://*) ;;
            *)
              echo "::error title=NEON_DATABASE_URL_DIRECT invalide::La valeur du secret doit commencer par postgresql:// (longueur ${#url} caractères, contient 'postgresql://' : $(case "$url" in *postgresql://*) echo oui;; *) echo non;; esac)). Dans Neon → Connect, copiez la chaîne de connexion seule (pas la commande psql), sans guillemets."
              exit 1;;
          esac
          case "$url" in
            *-pooler.*) echo "::warning title=URL poolée::NEON_DATABASE_URL_DIRECT pointe vers l'hôte « -pooler » : utilisez l'URL DIRECTE (Connection pooling désactivé) pour les migrations.";;
          esac
          echo "NEON_URL=$url" >> "$GITHUB_ENV"
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        if: steps.guard.outputs.skip != 'true'
        working-directory: backend
        run: npm ci
      - name: Prisma migrate deploy
        if: steps.guard.outputs.skip != 'true'
        working-directory: backend
        run: DATABASE_URL="$NEON_URL" npx prisma migrate deploy

  # Smoke Playwright (bloquant, sur pull_request et push) : frontend de production + API SIMULÉE
  # (page.route + frontend/e2e/fixtures). Aucun backend ni base de données.
  # Local : NEXT_PUBLIC_API_URL=http://127.0.0.1:4010 npm run build && npx playwright test --project=smoke
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      # L'URL de l'API est inlinée dans le bundle ET dans la CSP : elle doit être celle des mocks
      # (e2e/support/mock-api.ts, API_ORIGIN).
      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4010
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Smoke e2e (desktop + mobile)
        working-directory: frontend
        env:
          CI: 'true'
        run: npx playwright test --project=smoke --project=smoke-mobile
      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
