name: Keep API warm

# L'offre gratuite Render met l'API en veille après 15 min sans trafic (réveil ~30-60 s).
#
# ⚠️ Le dépôt est PRIVÉ : un cron GitHub Actions toutes les 10 min consommerait ~4 300 min/mois,
# au-delà des 2 000 min gratuites, et bloquerait toute la CI (y compris les migrations).
# → Utiliser plutôt un pinger externe gratuit : UptimeRobot (monitor HTTP toutes les 5 min sur
#   <API_URL>/health), qui sert en même temps de supervision (DEP-04). Voir docs/DEPLOY.md.
# Ce workflow reste disponible en déclenchement manuel (diagnostic).

on:
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    if: vars.API_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - env:
          API_URL: ${{ vars.API_URL }}
        run: curl -fsS --max-time 90 "$API_URL/health"
