name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit backend
        working-directory: backend
        run: npm audit --audit-level=high
      - name: Audit frontend
        working-directory: frontend
        run: npm audit --audit-level=high
