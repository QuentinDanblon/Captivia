version: 2

# Économie de minutes Actions : chaque PR de Dependabot relance toute la CI et un aperçu
# Netlify. Donc : une fois par mois, toutes les mises à jour d'un écosystème regroupées en une
# seule PR (versions majeures comprises, à relire avant fusion), une seule PR ouverte à la fois.
# Les correctifs de sécurité (Dependabot security updates, réglage du dépôt) ne sont pas
# concernés et restent immédiats.
updates:
  - package-ecosystem: npm
    directories: ["/", "/backend", "/frontend"]
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      npm-mensuel:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions-mensuel:
        patterns: ["*"]
